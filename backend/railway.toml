[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "npm run start:all"
  restart_policy_type = "ON_FAILURE"
  restart_policy_max_retries = 5
  # Apply DB migrations before the new release starts serving traffic.
  # Idempotent (schema_migrations tracks applied ids). Seeds are NOT run here:
  # the DB already has content, and setup-db would duplicate it.
  preDeployCommand = "npm run migrate && npm run migrate-stars && npm run migrate-ton && npm run migrate-ukassa"

[env]
  NODE_ENV = "production"
  PORT = "10000"
  ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173,https://solve-it-rho.vercel.app"
