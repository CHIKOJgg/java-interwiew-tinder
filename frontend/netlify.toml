[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "/api"
  NODE_ENV = "production"

# API proxy to the live Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://java-interwiew-tinder-production.up.railway.app/api/:splat"
  status = 200

# SPA fallback (deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
